<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="'SF Mono', 'Consolas', 'Menlo', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">pg-snowflake-cdc — data flow</text>

  <!-- PostgreSQL box -->
  <rect x="20" y="70" width="230" height="320" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="135" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">PostgreSQL</text>
  <text x="135" y="116" text-anchor="middle" font-size="10.5" fill="#3b5686">source database</text>

  <rect x="40" y="132" width="190" height="46" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="135" y="150" text-anchor="middle" font-size="11" fill="#1e293b">public.customers</text>
  <text x="135" y="165" text-anchor="middle" font-size="9.5" fill="#64748b">PARTITION BY HASH(tenant_id)</text>

  <rect x="40" y="188" width="190" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="135" y="209" text-anchor="middle" font-size="11" fill="#1e293b">public.customer_devices</text>

  <rect x="40" y="240" width="190" height="60" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="135" y="260" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">WAL</text>
  <text x="135" y="276" text-anchor="middle" font-size="10" fill="#1e3a8a">publication: cdc_pub</text>
  <text x="135" y="290" text-anchor="middle" font-size="10" fill="#1e3a8a">slot: cdc_slot (pgoutput)</text>

  <text x="135" y="330" text-anchor="middle" font-size="9.5" fill="#64748b">sql/postgres_setup.sql</text>
  <text x="135" y="345" text-anchor="middle" font-size="9.5" fill="#64748b">REPLICA IDENTITY FULL</text>

  <!-- Arrow PG -> service -->
  <line x1="250" y1="240" x2="330" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="230" text-anchor="middle" font-size="9.5" fill="#475569">pgoutput</text>
  <text x="290" y="256" text-anchor="middle" font-size="9.5" fill="#475569">(polled)</text>

  <!-- Service box -->
  <rect x="335" y="70" width="300" height="320" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="485" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">pg-snowflake-cdc</text>
  <text x="485" y="116" text-anchor="middle" font-size="10.5" fill="#5b21b6">src/main.py (single Python process)</text>

  <rect x="355" y="132" width="260" height="42" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="485" y="149" text-anchor="middle" font-size="10.5" fill="#1e293b">pg_replication.py</text>
  <text x="485" y="163" text-anchor="middle" font-size="9" fill="#64748b">poll_changes() → raw WAL bytes</text>

  <line x1="485" y1="174" x2="485" y2="186" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="355" y="188" width="260" height="42" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="485" y="205" text-anchor="middle" font-size="10.5" fill="#1e293b">pgoutput_parser.py</text>
  <text x="485" y="219" text-anchor="middle" font-size="9" fill="#64748b">binary → ChangeEvent</text>

  <line x1="485" y1="230" x2="485" y2="242" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="355" y="244" width="260" height="48" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="485" y="262" text-anchor="middle" font-size="10.5" fill="#1e293b">snowflake_sink.py</text>
  <text x="485" y="276" text-anchor="middle" font-size="9" fill="#64748b">buffers events, batches per table</text>
  <text x="485" y="288" text-anchor="middle" font-size="9" fill="#64748b">size or interval triggers a flush</text>

  <rect x="355" y="308" width="122" height="40" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="416" y="325" text-anchor="middle" font-size="9.5" fill="#4c1d95">health.py</text>
  <text x="416" y="339" text-anchor="middle" font-size="8.5" fill="#5b21b6">:8080 /healthz /readyz</text>

  <rect x="493" y="308" width="122" height="40" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="554" y="325" text-anchor="middle" font-size="9.5" fill="#4c1d95">monitoring.py</text>
  <text x="554" y="339" text-anchor="middle" font-size="8.5" fill="#5b21b6">OTel + Datadog (optional)</text>

  <text x="485" y="374" text-anchor="middle" font-size="9.5" fill="#64748b">retries with back-off · replays</text>
  <text x="485" y="388" text-anchor="middle" font-size="9.5" fill="#64748b">from the slot on restart</text>

  <!-- Arrow service -> SF -->
  <line x1="635" y1="240" x2="715" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="675" y="230" text-anchor="middle" font-size="9.5" fill="#475569">MERGE +</text>
  <text x="675" y="256" text-anchor="middle" font-size="9.5" fill="#475569">INSERT</text>

  <!-- Snowflake box -->
  <rect x="720" y="70" width="240" height="320" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="840" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Snowflake</text>
  <text x="840" y="116" text-anchor="middle" font-size="10.5" fill="#0f766e">destination warehouse</text>

  <rect x="740" y="132" width="200" height="42" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="840" y="149" text-anchor="middle" font-size="11" fill="#1e293b">CUSTOMERS</text>
  <text x="840" y="163" text-anchor="middle" font-size="9" fill="#64748b">current state, MERGE on PK</text>

  <rect x="740" y="182" width="200" height="42" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="840" y="199" text-anchor="middle" font-size="11" fill="#1e293b">CUSTOMERS_HISTORY</text>
  <text x="840" y="213" text-anchor="middle" font-size="9" fill="#64748b">append-only, INSERT always</text>

  <rect x="740" y="232" width="200" height="42" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="840" y="249" text-anchor="middle" font-size="11" fill="#1e293b">CUSTOMER_DEVICES</text>
  <text x="840" y="263" text-anchor="middle" font-size="9" fill="#64748b">current state, MERGE on PK</text>

  <rect x="740" y="282" width="200" height="42" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="840" y="299" text-anchor="middle" font-size="11" fill="#1e293b">CUSTOMER_DEVICES_HISTORY</text>
  <text x="840" y="313" text-anchor="middle" font-size="9" fill="#64748b">append-only, INSERT always</text>

  <text x="840" y="350" text-anchor="middle" font-size="9.5" fill="#64748b">sql/snowflake_setup.sql</text>
  <text x="840" y="365" text-anchor="middle" font-size="9.5" fill="#64748b">_CDC_OP / _CDC_LSN / _CDC_TS</text>

  <!-- Footer -->
  <text x="490" y="430" text-anchor="middle" font-size="10" fill="#94a3b8">one Python process · no Kafka · no schema registry</text>
</svg>
